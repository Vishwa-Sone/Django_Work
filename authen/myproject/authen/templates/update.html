{% extends 'main.html' %}

{% block content %}
    <center>
        <h1>This is Update Page</h1>
        <br><br><hr><br><br>

        
        <img src="{{ data.image.image.url }}" alt="Profile image" style="height: 200px;width: 150px;border-radius: 50%;">

        <form action="" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label>Image</label>
            <input type="file" name="image"><br>

            <label for="">First Name : </label>
            <input type="text" name="first_name" value="{{data.data.first_name}}"><br><br>
            <label for="">Last Name : </label>
            <input type="text" name="last_name" value="{{data.data.last_name}}"><br><br>
            <label for="">Email : </label>
            <input type="email" name="email" value="{{data.data.email}}"><br><br>

            <button type="submit">Update</button>
            <br><br>
        </form>

    </center>
{% endblock %}
