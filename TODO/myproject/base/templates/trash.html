{% extends 'main.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% endblock %}

{% block content %}
<center>
    <h1>Trash page</h1>
    <p>These are the deleted items!</p>
    <a href="{% url 'trestore_all' %}">Restore All</a>
    <a href="{% url 'tdelete_all' %}">Delete All</a>

    {% for i in data %}
    <hr>
    <span>Title</span> : {{i.title}}<br>
    <span>Desc</span> : {{i.desc}}<br>
    <a href="{% url 'trestore' i.id %}">Restore</a>
    <a href="{% url 'tdelete' i.id %}">Delete</a>
    <br><hr>


    {% endfor %}
</center>
{% endblock %}
