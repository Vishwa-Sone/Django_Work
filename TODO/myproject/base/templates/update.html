{% extends 'main.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% endblock %}


{% block content %}
<h1>Update page</h1>

<center>
    <form method="POST">
        {% csrf_token %}
        <label>Title</label>
        <input type="text" name="title" id="" value="{{data.title}}"><br>

        <label>DESC</label>
        <input type="text" name="desc" id="" value="{{data.desc}}"><br>
        <button>Submit</button>
        

    </form>
</center>
{% endblock %}
